name: Main Build

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  npm-merge:
    # Pinned to common-utils main commit 7cdda8f6000fab3c2597d14ab5c65c02790079e7 (2026-11-26):
    # common-utils publishes no tags/releases. Bump this SHA deliberately after
    # reviewing common-utils changes.
    uses: devopsplaybook-io/common-utils/.github/workflows/reusable-npm-merge.yml@7cdda8f6000fab3c2597d14ab5c65c02790079e7
    with:
      npm_package_name: "@devopsplaybook.io/otel-utils"
      node_version: "22"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
