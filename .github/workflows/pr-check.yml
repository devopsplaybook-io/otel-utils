name: PR Check

on:
  pull_request:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  npm-pr:
    # Pinned to common-utils main commit 6353cedf6d3527bbadbef8fa3da68031dcfe131f (2026-11-06):
    # common-utils publishes no tags/releases. Bump this SHA deliberately after
    # reviewing common-utils changes.
    uses: devopsplaybook-io/common-utils/.github/workflows/reusable-npm-pr.yml@6353cedf6d3527bbadbef8fa3da68031dcfe131f
    with:
      npm_package_name: "@devopsplaybook.io/otel-utils"
      node_version: "22"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
